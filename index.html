<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credencial de la gymkhana — Rías Baixas y Costa da Morte</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --granite-900:#2b2a26;
    --granite-700:#4d4b44;
    --granite-500:#7a776c;
    --granite-300:#b3b0a3;
    --granite-100:#e4e1d5;
    --parchment:#efeade;
    --atlantic-900:#12333f;
    --atlantic-700:#1d4d5c;
    --atlantic-500:#2f7488;
    --gorse:#b8903f;
    --gorse-light:#e9d3a3;
    --moss:#5b6b47;
    --moss-light:#c7d1b8;
    --coral:#a4482f;
    --coral-light:#e9c3b3;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    font-family:'Inter',sans-serif;
    background:var(--parchment);
    color:var(--granite-900);
    max-width:520px;
    margin:0 auto;
    padding-bottom:2rem;
  }
  .cover{
    background:var(--atlantic-900);
    color:var(--parchment);
    padding:1.75rem 1.5rem 1.5rem;
    position:relative;
    border-bottom:3px double var(--gorse);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gorse-light);
    margin:0 0 0.4rem;
  }
  .cover h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 0.3rem;
    line-height:1.2;
  }
  .cover p{
    font-size:13px;
    color:var(--granite-100);
    margin:0;
    line-height:1.5;
  }
  .shell-icon{
    position:absolute;
    top:1.6rem;
    right:1.5rem;
    width:34px;
    height:34px;
    opacity:0.85;
  }
  .progress-wrap{
    padding:1rem 1.5rem 0.25rem;
  }
  .progress-track{
    height:6px;
    border-radius:3px;
    background:var(--granite-100);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--gorse);
    width:0%;
    transition:width 0.4s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--granite-500);
    margin-top:6px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:1rem 1.5rem 0.5rem;
  }
  .tab-btn{
    flex:1 1 auto;
    min-width:80px;
    background:transparent;
    border:1px solid var(--granite-300);
    color:var(--granite-700);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    padding:8px 6px;
    border-radius:6px;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--atlantic-900);
    border-color:var(--atlantic-900);
    color:var(--parchment);
  }
  .section{
    display:none;
    padding:0.75rem 1.5rem 0.5rem;
  }
  .section.active{display:block;}
  .section-note{
    font-size:12.5px;
    color:var(--granite-500);
    line-height:1.5;
    margin:0 0 1rem;
    font-style:italic;
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--granite-100);
    cursor:pointer;
  }
  .item:last-child{border-bottom:none;}
  .stamp{
    flex:none;
    width:26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--granite-300);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
    transition:all 0.2s ease;
  }
  .stamp svg{
    width:14px;
    height:14px;
    fill:none;
    stroke:var(--granite-300);
    stroke-width:2;
    transition:all 0.2s ease;
  }
  .item.done .stamp{
    background:var(--gorse);
    border-color:var(--gorse);
  }
  .item.done .stamp svg{
    stroke:var(--parchment);
  }
  .item-text{flex:1;}
  .item-title{
    font-size:14.5px;
    font-weight:500;
    color:var(--granite-900);
    margin:0 0 2px;
  }
  .item.done .item-title{
    color:var(--granite-500);
    text-decoration:line-through;
    text-decoration-color:var(--granite-300);
  }
  .item-desc{
    font-size:12.5px;
    color:var(--granite-500);
    line-height:1.45;
    margin:0;
  }
  .item-type{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:1px 6px;
    border-radius:4px;
    margin-bottom:4px;
  }
  .type-curiosidad{background:var(--atlantic-500);color:var(--parchment);}
  .type-foto{background:var(--moss);color:var(--parchment);}
  .type-natura{background:#3f7d3a;color:var(--parchment);}
  .type-sabor{background:var(--coral);color:var(--parchment);}
  .reset-row{
    padding:1.5rem 1.5rem 0;
    text-align:center;
  }
  .reset-btn{
    background:none;
    border:1px solid var(--granite-300);
    color:var(--granite-500);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">

  <div class="cover">
    <svg class="shell-icon" viewBox="0 0 24 24"><path fill="none" stroke="#e9d3a3" stroke-width="1.4" d="M12 3c-3.5 3-6 8-6 13.5S9 21 12 21s6-1.9 6-4.5S15.5 6 12 3z"/><path fill="none" stroke="#e9d3a3" stroke-width="1" d="M12 3v18M9 6v13.5M6 10v6.5M15 6v13.5M18 10v6.5"/></svg>
    <p class="eyebrow">Credencial de la gymkhana</p>
    <h1>Rías Baixas y Costa da Morte</h1>
    <p>Completa cada reto y ve sellando tu credencial. Fotos, sabores, aves y secretos por descubrir. Se guarda solo.</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressText">0 de 0 completados</span><span id="progressPct">0%</span></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="sections"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">Reiniciar credencial</button>
  </div>

</div>

<script>
const LOCATIONS = [
  {key:'santiago', label:'Santiago', note:'Casco histórico y catedral'},
  {key:'muxia', label:'Muxía', note:'Santuario da Virxe da Barca y sus piedras sagradas'},
  {key:'fisterra', label:'Fisterra', note:'El fin del Camino, sobre el Atlántico'},
  {key:'cies', label:'Cíes', note:'Parque Nacional das Illas Atlánticas'},
  {key:'ogrove', label:'O Grove', note:'Península marinera y bateas de la ría de Arousa'},
  {key:'arousa', label:'A Illa', note:'Isla de Arousa, la mayor isla habitada de España'},
  {key:'combarro', label:'Combarro', note:'El pueblo de los hórreos sobre el mar'},
  {key:'cambados', label:'Cambados', note:'La capital del vino Albariño'},
  {key:'ponferrada', label:'Ponferrada', note:'El Castillo de los Templarios, en León'},
  {key:'villafranca', label:'Villafranca', note:'Villafranca del Bierzo, "la pequeña Compostela"'},
  {key:'salamanca', label:'Salamanca', note:'La ciudad dorada y su Universidad'},
];

const DATA = {
  santiago: [
    {id:'s1', type:'curiosidad', title:'Encuentra la sombra del peregrino', desc:'Praza da Quintana, junto a la Puerta Santa. Se ve al anochecer, cuando se enciende el alumbrado: la silueta de un caminante con bastón sobre el muro.'},
    {id:'s2', type:'curiosidad', title:'Ve al Botafumeiro en marcha', desc:'El gran incensario de 80 kg, si tienes suerte de verlo volar durante una misa o celebración.'},
    {id:'s3', type:'curiosidad', title:'Busca la estatua del Maestro Mateo', desc:'Detrás del Pórtico de la Gloria, mirando al altar. Los estudiantes se daban golpecitos de cabeza contra ella antes de examinarse.'},
    {id:'s4', type:'curiosidad', title:'Localiza marcas de canónigos y canteros', desc:'En la fachada del Obradoiro y en el claustro, busca las lápidas y marcas que dejaron los canónigos y maestros canteros que trabajaron en la catedral.'},
    {id:'s5', type:'curiosidad', title:'Busca la campana Berenguela original', desc:'La antigua campana, de 10 toneladas, se conserva en el claustro de la catedral.'},
    {id:'s6', type:'foto', title:'Fotografía la fachada del Obradoiro', desc:'La icónica fachada barroca, la que aparece en las monedas de 1, 2 y 5 céntimos.'},
    {id:'s7', type:'foto', title:'Hazte una foto junto a un hórreo', desc:'El típico granero elevado de piedra o madera, símbolo del rural gallego.'},
    {id:'s8', type:'foto', title:'Fotografía la Praza do Obradoiro de noche', desc:'La gran plaza iluminada, con la catedral y el Hostal de los Reyes Católicos.'},
  ],
  muxia: [
    {id:'m1', type:'curiosidad', title:'Encuentra la Pedra de Abalar', desc:'La piedra que se balancea; según la leyenda, quien la mueve está libre de pecado.'},
    {id:'m2', type:'curiosidad', title:'Pasa bajo la Pedra dos Cadrís', desc:'Con forma de riñón: pasar nueve veces por debajo cura dolores de espalda y riñones, dice la tradición.'},
    {id:'m3', type:'curiosidad', title:'Localiza la Pedra do Timón', desc:'El timón de la barca de piedra en la que llegó la Virgen, según la leyenda local.'},
    {id:'m4', type:'foto', title:'Fotografía A Ferida', desc:'Escultura frente al santuario que recuerda el desastre del Prestige.'},
    {id:'m5', type:'foto', title:'Fotografía el Santuario da Virxe da Barca', desc:'La iglesia barroca construida casi sobre el mar, reconstruida varias veces tras incendios.'},
    {id:'m6', type:'foto', title:'Fotografía el faro de Punta da Barca', desc:'Junto al santuario, con vistas a la Costa da Morte.'},
  ],
  fisterra: [
    {id:'f1', type:'curiosidad', title:'Busca la plaza del Ara Solis', desc:'Se cree que aquí hubo un altar precristiano dedicado al culto del sol, aunque no hay pruebas arqueológicas confirmadas.'},
    {id:'f2', type:'curiosidad', title:'Averigua cuál es el cabo más occidental real', desc:'Pese a la fama, el cabo más occidental de Europa continental es Cabo da Roca (Portugal), y el más occidental de España es Touriñán, muy cerca de Muxía.'},
    {id:'f3', type:'foto', title:'Fotografía la bota del peregrino', desc:'Escultura en lo alto, junto al faro, que representa el ritual de quemar la ropa al terminar el Camino.'},
    {id:'f4', type:'foto', title:'Fotografía el faro de Fisterra', desc:'El faro sobre el acantilado, meta simbólica del "fin del mundo".'},
    {id:'f5', type:'foto', title:'Captura la puesta de sol en el Atlántico', desc:'El horizonte donde, para los romanos, se apagaba el sol cada noche.'},
    {id:'f6', type:'foto', title:'Busca la placa del kilómetro 0', desc:'Marca el final físico de la extensión del Camino de Santiago hasta la costa.'},
  ],
  cies: [
    {id:'c1', type:'foto', title:'Hazte una foto en la playa de Rodas', desc:'Elegida mejor playa del mundo por el diario The Guardian en 2007.'},
    {id:'c2', type:'natura', title:'Identifica 3 aves distintas', desc:'Busca gaviota patiamarilla, cormorán moñudo o garza en el observatorio de aves. Lleva prismáticos si puedes.'},
    {id:'c3', type:'curiosidad', title:'Encuentra la Pedra da Campá', desc:'Una roca horadada por el viento con forma de ventana, en el camino al faro.'},
    {id:'c4', type:'foto', title:'Sube al faro y fotografía las tres islas', desc:'Desde el punto más alto del archipiélago: Monteagudo, Faro y San Martiño.'},
    {id:'c5', type:'curiosidad', title:'Averigua cuántos visitantes al día se permiten', desc:'Solo un número limitado de personas puede acceder cada día a este parque nacional protegido.'},
  ],
  ogrove: [
    {id:'o1', type:'curiosidad', title:'Aprende la leyenda de las nueve olas', desc:'En la playa de A Lanzada: un rito pagano de fertilidad en el que hay que dejarse golpear por nueve olas.'},
    {id:'o2', type:'curiosidad', title:'Descubre el origen legendario de A Toxa', desc:'Cuenta la leyenda que sus aguas termales curativas se descubrieron gracias a un burro sarnoso.'},
    {id:'o3', type:'foto', title:'Fotografía las bateas de mejillones', desc:'Las plataformas flotantes de cultivo de mejillón, típicas de la ría, vistas desde el mirador de Siradella.'},
    {id:'o4', type:'sabor', title:'Prueba el marisco fresco del puerto', desc:'El puerto de O Grove es el corazón pesquero de la península.'},
  ],
  arousa: [
    {id:'a1', type:'curiosidad', title:'Averigua por qué la llaman la mayor isla habitada de España', desc:'La Illa de Arousa es, según muchos, la isla habitada más grande del país.'},
    {id:'a2', type:'curiosidad', title:'Descubre la república de un solo día', desc:'En 1934 se proclamó aquí la República Federal de la Illa de Arousa, que duró solamente 24 horas.'},
    {id:'a3', type:'foto', title:'Fotografía el puente que une la isla a tierra firme', desc:'Construido en 1985, cambió para siempre la vida de sus habitantes.'},
    {id:'a4', type:'natura', title:'Observa aves en el Parque Natural de O Carreirón', desc:'Una zona húmeda protegida, buen punto para el avistamiento.'},
  ],
  combarro: [
    {id:'cb1', type:'foto', title:'Hazte una foto junto a un hórreo sobre el mar', desc:'En A Rúa do Mar, donde casi la mitad de los hórreos del pueblo están al borde del agua.'},
    {id:'cb2', type:'curiosidad', title:'Encuentra los 7 cruceiros del casco antiguo', desc:'Fíjate hacia dónde mira la Virgen (al mar) y hacia dónde mira Cristo (a la tierra) en cada uno.'},
    {id:'cb3', type:'curiosidad', title:'Busca el cruceiro que rompe la norma', desc:'Casi todos siguen el mismo patrón de orientación, salvo uno: encuéntralo.'},
    {id:'cb4', type:'sabor', title:'Prueba mejillones con vino albariño', desc:'El maridaje clásico de un paseo por la ría de Pontevedra.'},
    {id:'cb5', type:'foto', title:'Fotografía una casa mariñeira con soportales', desc:'Las tradicionales casas de pescadores, con balcones de piedra o madera.'},
  ],
  cambados: [
    {id:'ca1', type:'sabor', title:'Prueba una copa de Albariño en su capital', desc:'Cambados es conocida como la capital mundial de este vino blanco.'},
    {id:'ca2', type:'curiosidad', title:'Cuenta los pazos del casco histórico', desc:'Cambados conserva 7 pazos, antiguas casas señoriales de nobleza o clero.'},
    {id:'ca3', type:'foto', title:'Fotografía las ruinas góticas de Santa Mariña de Dozo', desc:'Un cementerio único, con arcos abiertos al cielo.'},
    {id:'ca4', type:'foto', title:'Busca la torre medieval de San Sadurniño', desc:'Reforzada por el arzobispo Gelmírez como parte de una red de defensa contra ataques vikingos.'},
  ],
  ponferrada: [
    {id:'p1', type:'foto', title:'Fotografía el Castillo de los Templarios', desc:'Una de las fortalezas templarias más grandes de la Península, con casi 10.000 m² y doce torres.'},
    {id:'p2', type:'curiosidad', title:'Descubre la leyenda del tesoro oculto', desc:'Se dice que los templarios escondieron aquí el Santo Grial y el Arca de la Alianza. Nadie lo ha encontrado.'},
    {id:'p3', type:'curiosidad', title:'Averigua el origen de la Virgen de la Encina', desc:'Cuenta la leyenda que esta talla, patrona de Ponferrada, apareció escondida dentro del tronco de una encina.'},
    {id:'p4', type:'curiosidad', title:'Cuenta las torres del castillo', desc:'Tiene doce, un número que algunos relacionan con las constelaciones o los apóstoles. Compruébalo tú mismo.'},
  ],
  villafranca: [
    {id:'v1', type:'foto', title:'Fotografía la Puerta del Perdón', desc:'En la Iglesia de Santiago: cruzarla en Año Santo da el mismo jubileo que llegar a Compostela.'},
    {id:'v2', type:'curiosidad', title:'Averigua por qué la llaman "la pequeña Compostela"', desc:'Los peregrinos enfermos que no podían continuar el Camino obtenían aquí el mismo perdón que en Santiago.'},
    {id:'v3', type:'curiosidad', title:'Conoce la leyenda fundacional de la vaca blanca', desc:'Cuenta la tradición que unos pastores siguieron a una vaca blanca durante una tormenta, y donde esta se detuvo nació el pueblo.'},
    {id:'v4', type:'foto', title:'Fotografía el castillo-palacio de los marqueses', desc:'Con sus torreones redondos, dominando la villa desde lo alto, pese a estar cerrado al público.'},
  ],
  salamanca: [
    {id:'sa1', type:'curiosidad', title:'Encuentra la rana de la fachada de la Universidad', desc:'Sobre una calavera tallada en piedra: quien la localiza sin ayuda, dice la tradición, aprobará sus exámenes.'},
    {id:'sa2', type:'curiosidad', title:'Busca el astronauta de la Catedral Nueva', desc:'Junto a la Puerta de Ramos. No es medieval: lo añadió un cantero en una restauración de 1992, junto a un dragón comiendo un helado.'},
    {id:'sa3', type:'foto', title:'Fotografía la Casa de las Conchas', desc:'Más de 300 conchas de piedra decoran su fachada; nadie se pone de acuerdo del todo sobre su significado.'},
    {id:'sa4', type:'foto', title:'Fotografía la Plaza Mayor al atardecer', desc:'Cuando la piedra de Villamayor se dora con la luz, el motivo por el que llaman a Salamanca "la ciudad dorada".'},
  ],
};

let state = {};

async function loadState(){
  try{
    const res = await window.storage.get('gymkhana-checklist', false);
    state = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    state = {};
  }
  render();
}

async function saveState(){
  try{
    await window.storage.set('gymkhana-checklist', JSON.stringify(state), false);
  }catch(e){}
}

function toggle(id){
  state[id] = !state[id];
  saveState();
  render();
}

function iconFor(type){
  if(type === 'foto'){
    return '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-2h5L16 7"/></svg>';
  }
  if(type === 'natura'){
    return '<svg viewBox="0 0 24 24"><path d="M4 15c4 0 7-3 7-7 0-2 1-4 1-4s1 2 1 4c0 4 3 7 7 7"/><path d="M12 8v13"/></svg>';
  }
  if(type === 'sabor'){
    return '<svg viewBox="0 0 24 24"><path d="M7 3v6a5 5 0 0010 0V3M12 9v12M8 21h8"/></svg>';
  }
  return '<svg viewBox="0 0 24 24"><path d="M12 3c-3.5 3-6 8-6 13.5S9 21 12 21s6-1.9 6-4.5S15.5 6 12 3z"/></svg>';
}

function typeLabel(type){
  if(type === 'foto') return 'Reto foto';
  if(type === 'natura') return 'Reto naturaleza';
  if(type === 'sabor') return 'Reto sabor';
  return 'Descúbrelo';
}

function renderList(key){
  const container = document.getElementById(key + '-list');
  container.innerHTML = '';
  DATA[key].forEach(item => {
    const div = document.createElement('div');
    div.className = 'item' + (state[item.id] ? ' done' : '');
    div.innerHTML = `
      <div class="stamp">${iconFor(item.type)}</div>
      <div class="item-text">
        <span class="item-type type-${item.type}">${typeLabel(item.type)}</span>
        <p class="item-title">${item.title}</p>
        <p class="item-desc">${item.desc}</p>
      </div>
    `;
    div.addEventListener('click', () => toggle(item.id));
    container.appendChild(div);
  });
}

function updateProgress(){
  const all = Object.values(DATA).flat();
  const done = all.filter(i => state[i.id]).length;
  const total = all.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + ' de ' + total + ' completados';
  document.getElementById('progressPct').textContent = pct + '%';
}

function render(){
  LOCATIONS.forEach(loc => renderList(loc.key));
  updateProgress();
}

function buildLayout(){
  const tabsEl = document.getElementById('tabs');
  const sectionsEl = document.getElementById('sections');
  LOCATIONS.forEach((loc, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.dataset.tab = loc.key;
    btn.textContent = loc.label;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(loc.key).classList.add('active');
    });
    tabsEl.appendChild(btn);

    const section = document.createElement('div');
    section.className = 'section' + (i === 0 ? ' active' : '');
    section.id = loc.key;
    section.innerHTML = `<p class="section-note">${loc.note}</p><div id="${loc.key}-list"></div>`;
    sectionsEl.appendChild(section);
  });
}

document.getElementById('resetBtn').addEventListener('click', () => {
  state = {};
  saveState();
  render();
});

buildLayout();
loadState();
</script>
</body>
</html>
